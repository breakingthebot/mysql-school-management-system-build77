[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mysql-school-db"
version = "1.0.0"
description = "Production-grade MySQL school management system featuring normalized schema, stored procedures, triggers, audit logging, analytical views, and Python CLI suite."
authors = [{ name = "BreakingTheBot" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pymysql>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
mysql-school = "school_db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"

